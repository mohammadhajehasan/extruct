# Render Blueprint — المستخرج الأسطوري v7.1
# الباك (FastAPI)   : mini-services/py-extractor → https://extruct.onrender.com
# الواجهة (Next.js) : جذر المستودع               → https://extruct-web.onrender.com
#
# قواعد ملزمة:
# - لا تُعلَن خدمة Redis: الكود لا يستخدم REDIS_URL إطلاقًا (تحقّق بالبحث في كل ملفات TS/Python).
# - لا يُعلَن PORT: Render يحقن PORT تلقائيًا، وكل خدمة تربط عليه عبر $PORT.
# - NEXT_PUBLIC_PY_BASE يُحقن في الواجهة وقت البناء → أي تغيير له يستلزم إعادة بناء (Redeploy)
#   لا مجرّد إعادة تشغيل. العنوان أدناه يجب أن يطابق subdomain خدمة الباك فعليًا.

services:
  - type: web
    name: extruct
    env: python
    region: Frankfurt
    plan: free
    rootDir: mini-services/py-extractor
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PY_BASE
        value: https://extruct.onrender.com/api
      # تقسية الذاكرة على خطة free (512MB) — ملف 50 صفحة ممسوحة ≈ 1.3GB خام ⇒ OOM ⇒ 503.
      # عاملان متوازيان + سقف 25 صفحة + سقف رفع 15MB + render بدقة 200 (بدل 300: ~2.25x أسرع).
      - key: PDF_PARSE_WORKERS
        value: "2"
      - key: PDF_MAX_PAGES
        value: "25"
      - key: PDF_MAX_UPLOAD_MB
        value: "15"
      - key: PDF_RENDER_DPI
        value: "200"

  - type: web
    name: extruct-web
    env: node
    region: Frankfurt
    plan: free
    rootDir: .
    buildCommand: bun install && bun run build
    startCommand: bun start
    envVars:
      - key: NEXT_PUBLIC_PY_BASE
        value: https://extruct.onrender.com/api
      - key: NODE_VERSION
        value: "22"
