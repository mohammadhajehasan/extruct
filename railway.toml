[build]
  builder = "python"
  buildCommand = "pip install -r requirements.txt"

[deploy]
  restartPolicy = "on-failure"
  restartLimit = 3
  startCommand = "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
  healthCheckPath = "/api/health"
  healthCheckTimeout = 20
  healthCheckInterval = 10
  healthCheckMethod = "GET"

[[services]]
  name = "extruct-py"
  source = "mini-services/py-extractor"

# ملاحظة ملزمة: لا خدمة Redis — الكود لا يستخدم REDIS_URL إطلاقاً
# (أُزيل مقطع extruct-redis المهجور الذي كان يتعارض مع render.yaml وREADME).

[env]
  PORT = "8000"